      <path d="M90 152 L104 194 a8 8 0 0 0 8 6 h10 a6 6 0 0 0 6 -8 L118 160 Z"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
