      <path d="M200 86 a52 52 0 0 1 0 84"/>
    </g>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="178" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Screamer</text>
    <text x="400" y="230" font-size="26" font-weight="400" fill="#A1A8B8">Say it loud. Real-time microblogging on .NET and Angular.</text>
    <rect x="400" y="272" width="84" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="442" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">.NET 7</text>
    <rect x="496" y="272" width="141" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="566" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">ASP.NET Core</text>
    <rect x="649" y="272" width="111" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="704" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">Angular 16</text>
    <rect x="772" y="272" width="88" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="816" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">SignalR</text>
    <rect x="872" y="272" width="121" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="932" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">SQL Server</text>
    <rect x="1005" y="272" width="132" height="38" rx="19" fill="#EC4899" fill-opacity="0.10" stroke="url(#lg)" stroke-width="1"/>
    <text x="1071" y="297" text-anchor="middle" font-size="16" font-weight="600" fill="#E5E7EB">Tailwind CSS</text>
  </g>
