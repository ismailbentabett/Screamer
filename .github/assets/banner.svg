<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Screamer banner">
  <defs>
    <clipPath id="clip"><rect width="1280" height="400" rx="24"/></clipPath>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#EC4899" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="400" fill="#0B0F19"/>
    <rect width="1280" height="400" fill="url(#wash)"/>
    <rect width="1280" height="400" fill="url(#dots)" opacity="0.06"/>
    <circle cx="224" cy="200" r="210" fill="url(#glow)"/>
  </g>
  <g transform="translate(104 80) scale(0.9375)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#lg)"/>
    <g fill="#FFFFFF">
